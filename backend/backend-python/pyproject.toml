[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commskit"
version = "0.1.0"
description = "Generic 1:1 chat + WebRTC voice-call signalling kit for FastAPI (with moderation, devices and push)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "snakechat" }]
keywords = ["chat", "voice-call", "webrtc", "websocket", "fastapi", "realtime", "signaling", "commskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
s3 = ["boto3>=1.28", "pillow>=10"]                    # S3Storage (+ image thumbnails)
media = ["pillow>=10"]                                   # commskit.core.media_tools thumbnails (ffmpeg/ffprobe optional, on PATH)
push = ["httpx>=0.27"]                                   # ExpoPushSender / DevicePushRouter
apns = ["httpx[http2]>=0.27", "cryptography>=42"]        # ApnsVoipSender (HTTP/2 + ES256 JWT)
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=42",                                  # APNs JWT tests
    "pillow>=10",                                        # media_tools tests
]

[project.urls]
Homepage = "https://github.com/prateek0128/chat-call-module/tree/main/backend/backend-python#readme"
Repository = "https://github.com/prateek0128/chat-call-module"
Issues = "https://github.com/prateek0128/chat-call-module/issues"

[tool.setuptools.packages.find]
include = ["commskit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
