[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commskit"
version = "0.1.0"
description = "Generic 1:1 chat + WebRTC voice-call signalling kit for FastAPI (with moderation, devices and push)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
s3 = ["boto3>=1.28", "pillow>=10"]                    # S3Storage (+ image thumbnails)
media = ["pillow>=10"]                                   # commskit.core.media_tools thumbnails (ffmpeg/ffprobe optional, on PATH)
push = ["httpx>=0.27"]                                   # ExpoPushSender / DevicePushRouter
apns = ["httpx[http2]>=0.27", "cryptography>=42"]        # ApnsVoipSender (HTTP/2 + ES256 JWT)
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=42",                                  # APNs JWT tests
    "pillow>=10",                                        # media_tools tests
]

[tool.setuptools.packages.find]
include = ["commskit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
